name: Build Android APK (人教版高中英语听说)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # 支持在 GitHub 网页 Actions 页面手动一键触发打包

jobs:
  build:
    name: Build & Package Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 配置 Java 17 编译环境
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. 配置 Flutter 稳定版 SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 4. 诊断 Flutter 与构建环境
      - name: Run Flutter Doctor
        run: flutter doctor -v

      # 5. 下载依赖包
      - name: Install Dependencies
        run: flutter pub get

      # 6. 运行自动化单元测试 (包含选必一与核心数据仓库测试)
      - name: Run Unit Tests
        run: flutter test

      # 7. 编译生成正式版 APK 安装包 (通用安装包 + 分架构安装包)
      - name: Build Release APK
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      # 8. 重命名并整理产物
      - name: Organize APK Artifacts
        run: |
          mkdir -p output_apks
          cp build/app/outputs/flutter-apk/app-release.apk output_apks/HighSchoolEnglish-Student-Release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_apks/HighSchoolEnglish-Student-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_apks/HighSchoolEnglish-Student-armeabi-v7a.apk
          ls -la output_apks/

      # 9. 将 APK 作为构建工件上传至 GitHub Actions (免配置直接下载)
      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HighSchoolEnglish-Release-APK
          path: output_apks/*.apk
          retention-days: 30

      # 10. 若为版本发布 Tag (如 v1.0.0)，自动发布到 GitHub Releases
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
