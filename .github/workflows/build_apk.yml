name: Build Android APK (人教版高中英语听说)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # 支持在 GitHub 网页 Actions 页面手动一键触发打包

jobs:
  build:
    name: Build & Package Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 检出仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 配置 Java 17 编译环境
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. 配置 Flutter 稳定版 SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 4. 诊断 Flutter 与构建环境
      - name: Run Flutter Doctor
        run: flutter doctor -v

      # 5. 下载依赖包
      - name: Install Dependencies
        run: flutter pub get

      # 6. 运行自动化单元测试 (包含选必一与核心数据仓库测试)
      - name: Run Unit Tests
        run: flutter test

      # 7. 编译生成正式版 APK 安装包 (通用安装包 + 分架构安装包)
      - name: Build Release APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      # 8. 重命名并整理产物
      - name: Organize APK Artifacts
        run: |
          mkdir -p output_apks
          cp build/app/outputs/flutter-apk/app-release.apk output_apks/HighSchoolEnglish-Student-Release.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_apks/HighSchoolEnglish-Student-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_apks/HighSchoolEnglish-Student-armeabi-v7a.apk
          ls -la output_apks/

      # 9. 将 APK 作为构建工件上传至 GitHub Actions (免配置直接下载)
      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HighSchoolEnglish-Release-APK
          path: output_apks/*.apk
          retention-days: 30

      # 10. 自动发布到 GitHub Releases (支持 Release Tag 与 main 分支预览版)
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0-preview' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '人教版高中英语听说训练 (选必一) v1.0.0 预览版' }}
          body: |
            ## 🎓 人教版高中英语听说训练移动端 (选择性必修第一册专版)

            ### 🚀 本次更新包含：
            - **教材聚焦**：优先加载「选择性必修第一册」Unit 1《People of Achievement (屠呦呦与青蒿素)》与 Unit 2《Looking into the Future》。
            - **双口音精听与切换**：支持英音 (RP) 与美音 (GA) 原声无缝切换、0.8x/1.0x/1.2x 调速与原声比对。
            - **影子跟读训练**：支持 0.5s ~ 3.0s 可调节跟读延时、目标文本显示与实时录音对比。
            - **多维 AI 诊断反馈**：可理解度、内容完成度、流利度、重音语调、音素五维量化打分与生词发音指导。

            ### 📲 安装包下载指引：
            - `HighSchoolEnglish-Student-Release.apk`：通用版本，兼容绝大多数 Android 手机与平板。
            - `HighSchoolEnglish-Student-arm64-v8a.apk`：针对 64 位主流机型（体积更小，运行更高效）。
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

